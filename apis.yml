aid: illumix
name: Illumix
description: >-
  Illumix is an enterprise-grade spatial AI company spun out of Stanford's Computer Science
  Department, providing a core stack for real-world location intelligence that runs at the edge
  with centimeter-level precision. Its hardware-agnostic platform delivers sub-second localization
  and 3D mapping across mobile devices, AR/VR wearables, and robotics using standard cameras — with
  no LiDAR or GPS dependency — combining multimodal vision-language AI with long-term memory that
  learns behavior over time. Illumix serves AI/XR wearables, enterprise and logistics, defense and
  security, location-based entertainment, and robotics, with deployments referenced for Disney, Six
  Flags, Cedar Fair, MGM Resorts, Warner Bros, Verizon, and Sony. The company markets developer
  APIs and an SDK as part of a full-stack offering, but publishes no public developer portal,
  reference documentation, or machine-readable API specification at this time.
